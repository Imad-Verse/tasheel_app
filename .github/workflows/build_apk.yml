name: Build Tasheel Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Export Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. سحب الكود من المستودع
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. إعداد أحدث إصدار مستقر من Flutter مع تفعيل التخزين المؤقت
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # 4. تثبيت الحزم والاعتماديات
      - name: Install Flutter dependencies
        run: flutter pub get

      # 5. بناء ملف APK الإنتاجي الموحد
      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      # 6. رفع ملف الـ APK الناتج كمخرج قابل للتحميل
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tasheel-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

