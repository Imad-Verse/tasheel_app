name: tasheel_app
description: "تطبيق تسهيل - طريقك لتيسير العلوم الشرعية"
publish_to: "none"
version: 1.0.5+5

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # أيقونات iOS
  cupertino_icons: ^1.0.8

  # إدارة الحالة
  provider: ^6.1.5

  # الخطوط العربية (Readex Pro, Amiri, Tajawal)
  google_fonts: ^6.2.1

  # حفظ التفضيلات محلياً
  shared_preferences: ^2.5.3

  # مشغل الصوتيات المتقدم
  just_audio: ^0.9.46

  # فتح الروابط الخارجية (واتساب، يوتيوب)
  url_launcher: ^6.3.1

  # مشاركة التطبيق
  share_plus: ^10.1.4

  # تحميل الملفات وإدارة المسارات
  dio: ^5.8.0+1
  path_provider: ^2.1.5

  # خدمات Firebase السحابية
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.1
  youtube_player_iframe: ^6.0.2
  # معلومات وإصدار التطبيق
  package_info_plus: ^9.0.1
  just_audio_background: ^0.0.1-beta.17
  cached_network_image: ^4.0.7
  flutter_local_notifications: ^23.0.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-Light.ttf
          weight: 300
        - asset: assets/fonts/ReadexPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-Bold.ttf
          weight: 700

    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
